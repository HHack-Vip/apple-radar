<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; margin: 0; padding: 10px; height: 100vh; }
        .header { display: flex; justify-content: space-between; padding: 10px; font-size: 12px; border-bottom: 1px solid #333; }
        .container { display: flex; justify-content: center; gap: 15px; margin: 40px 0; }
        .apple { width: 60px; height: 60px; background: radial-gradient(circle at 30% 30%, #ff5e5e, #c00); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.2s; }
        .active-apple { background: radial-gradient(circle at 30% 30%, #0f0, #080); box-shadow: 0 0 20px #0f0; transform: scale(1.1); }
        button { padding: 15px 40px; background: #0f0; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; }
        #console { margin-top: 20px; padding: 15px; background: #111; border: 1px solid #333; height: 80px; overflow: hidden; font-size: 13px; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <span>ID: 20040099</span>
        <span>تجربة مجانية</span>
    </div>

    <div class="container">
        <div class="apple">🍎</div><div class="apple">🍎</div><div class="apple">🍎</div>
        <div class="apple">🍎</div><div class="apple">🍎</div>
    </div>

    <button onclick="startScan()">بدء الفحص</button>
    <div id="console">في انتظار أمر الفحص...</div>

    <script>
        function startScan() {
            const apples = document.querySelectorAll('.apple');
            const log = document.getElementById('console');
            let count = 0;
            
            log.innerText = "جاري الاتصال بالسيرفر...\nتم تحديد المسار...";
            
            let scan = setInterval(() => {
                apples.forEach(a => a.classList.remove('active-apple'));
                apples[count % 5].classList.add('active-apple');
                log.innerText = "فحص: 0x" + Math.random().toString(16).substr(2, 8) + "\nجاري تحليل النسبة...";
                count++;
            }, 150);

            setTimeout(() => {
                clearInterval(scan);
                let winner = Math.floor(Math.random() * 5);
                apples.forEach(a => a.classList.remove('active-apple'));
                apples[winner].classList.add('active-apple');
                log.innerText = ">>> اكتمل الفحص بنجاح!\nالتفاحة رقم " + (winner + 1) + " هي الهدف الصالح.";
            }, 3000);
        }
    </script>
</body>
</html>
