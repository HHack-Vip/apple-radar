<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
        .apple { width: 50px; height: 50px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.3s; }
        .active { background: red; box-shadow: 0 0 20px red; transform: scale(1.2); }
        button { padding: 15px 40px; background: #0f0; border: none; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #result { margin-top: 30px; font-size: 30px; font-weight: bold; color: #fff; }
    </style>
</head>
<body>
    <h2>نظام كشف التفاحة</h2>
    <div class="container" id="apples">
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
    </div>
    <button onclick="startScan()">بدء البحث عن الهدف</button>
    <div id="result">---</div>

    <script>
        function startScan() {
            const apples = document.querySelectorAll('.apple');
            const result = document.getElementById('result');
            let count = 0;
            result.innerText = "جاري الفحص...";
            
            // تفعيل "التمويه"
            let scan = setInterval(() => {
                apples.forEach(a => a.classList.remove('active'));
                apples[count % 5].classList.add('active');
                count++;
            }, 100);

            // إيقاف الفحص بعد 2 ثانية
            setTimeout(() => {
                clearInterval(scan);
                // تحديد التفاحة الفائزة عشوائياً
                let winner = Math.floor(Math.random() * 5);
                apples.forEach(a => a.classList.remove('active'));
                apples[winner].classList.add('active');
                result.innerText = "الهدف المكتشف: 1.23";
            }, 2000);
        }
    </script>
</body>
</html>
