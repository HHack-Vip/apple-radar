<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
        #radar { width: 200px; height: 200px; border: 3px solid #0f0; border-radius: 50%; margin: 20px auto; position: relative; }
        #num { font-size: 40px; color: #fff; margin: 20px; }
        button { padding: 15px 30px; background: #0f0; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Radar System</h3>
    <div id="radar"></div>
    <div id="num">0.00</div>
    <button onclick="scan()">START SCAN</button>
    <script>
        let v = [1.23, 1.54, 1.93, 2.41, 4.02, 6.71, 11.18, 27.97, 69.93, 349.68];
        let i = 0;
        function scan() {
            document.getElementById('num').innerText = "Scanning...";
            setTimeout(() => {
                document.getElementById('num').innerText = v[i % v.length];
                i++;
            }, 1500);
        }
    </script>
</body>
</html>
