<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0; overflow: hidden; }
        .screen { display: none; width: 90%; } .active { display: block; }
        input { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 15px; width: 100%; margin: 10px 0; border-radius: 10px; text-align: center; box-sizing: border-box; }
        button { padding: 15px; background: linear-gradient(145deg, #0f0, #080); border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 10px; margin: 10px 0; width: 100%; transition: 0.3s; }
        button:active { transform: scale(0.95); }
        
        #progress-container { width: 100%; height: 12px; background: #222; border-radius: 6px; margin: 20px 0; display: none; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #0f0; transition: 0.1s; }

        .header { display: flex; justify-content: space-between; padding: 10px; font-size: 13px; border-bottom: 1px solid #333; width: 100%; margin-bottom: 20px; }
        .container { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-direction: row-reverse; }
        .apple { width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #ff5e5e, #c00); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .active-apple { background: radial-gradient(circle at 30% 30%, #0f0, #080); box-shadow: 0 0 20px #0f0; transform: scale(1.1); }
        #console { margin: 10px 0; padding: 10px; background: #111; border: 1px solid #333; height: 45px; font-size: 12px; color: #fff; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="s0" class="screen active">
        <h2>Radar Pro v2.0</h2>
        <p style="color: #666; font-size: 14px;">خوارزمية الذكاء الاصطناعي لتحليل التفاح</p>
        <button onclick="goNext('s1')">ابدأ الاستخدام</button>
    </div>

    <div id="s1" class="screen"><input type="password" id="pass" placeholder="أدخل الباسورد"><button onclick="checkPass()">دخول</button></div>
    
    <div id="s2" class="screen"><h3>اختر النظام</h3><button onclick="selectSystem('trial')">تجربة مجانية</button><button onclick="selectSystem('vip')">نظام VIP</button></div>
    
    <div id="s3" class="screen"><input type="text" id="userid" placeholder="أدخل ID الجهاز"><button onclick="checkID()">تفعيل</button></div>
    
    <div id="s4" class="screen"><input type="password" id="vippass" placeholder="باسورد الـ VIP"><button onclick="checkVip()">دخول VIP</button></div>

    <div id="s5" class="screen">
        <div class="header"><span id="u-id">ID: ---</span><span id="u-mode">---</span></div>
        <div class="container">
            <div class="apple">🍎</div><div class="apple">🍎</div><div class="apple">🍎</div>
            <div class="apple">🍎</div><div class="apple">🍎</div>
        </div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <button onclick="startScan()">بدء الفحص</button>
        <div id="console">الجهاز جاهز للفحص</div>
    </div>

    <script>
        let isVip = false;
        function goNext(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function checkPass() { if(document.getElementById('pass').value == "15253596") goNext('s2'); else alert("كلمة المرور خاطئة!"); }
        function selectSystem(t) { isVip = (t=='vip'); goNext('s3'); }
        function checkID() { if(document.getElementById('userid').value == "20040099") { document.getElementById('u-id').innerText="ID: 20040099"; document.getElementById('u-mode').innerText=isVip?"VIP":"تجربة"; isVip?goNext('s4'):goNext('s5'); } else alert("ID غير صحيح!"); }
        function checkVip() { if(document.getElementById('vippass').value == "228817") goNext('s5'); else alert("باسورد VIP خاطئ!"); }

        function startScan() {
            const bar = document.getElementById('progress-bar');
            const cont = document.getElementById('progress-container');
            const log = document.getElementById('console');
            cont.style.display = 'block';
            let width = 0;
            let run = setInterval(() => {
                width += 5;
                bar.style.width = width + '%';
                log.innerText = "جاري التحليل: " + width + "%";
                if(width >= 100) { clearInterval(run); showResult(); }
            }, 100);
        }

        function showResult() {
            const apples = document.querySelectorAll('.apple');
            let winner = Math.floor(Math.random() * 5);
            let blink = 0;
            let b = setInterval(() => {
                apples[winner].classList.toggle('active-apple');
                if(++blink >= 6) { 
                    clearInterval(b); 
                    document.getElementById('progress-container').style.display='none'; 
                    document.getElementById('console').innerText = "الهدف المكتشف: التفاحة رقم " + (5-winner);
                    setTimeout(() => apples[winner].classList.remove('active-apple'), 1000);
                }
            }, 300);
        }
    </script>
</body>
</html>
