<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding: 10px; }
        .container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .apple { width: 65px; height: 65px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; transition: 0.2s; border: 2px solid #000; }
        .active { background: red; box-shadow: 0 0 25px red; transform: scale(1.3); border-color: #fff; }
        button { padding: 15px 30px; background: #0f0; border: none; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; color: #000; }
        #console { margin-top: 20px; padding: 15px; border: 1px solid #0f0; background: #050505; height: 50px; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #0f0; }
    </style>
</head>
<body>
    <h3>نظام الرادار الذكي</h3>
    <div class="container">
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
        <div class="apple">🍎</div>
    </div>
    <button onclick="startScan()">بدء الفحص</button>
    <div id="console">بانتظار أمر البدء...</div>

    <script>
        function log(msg) { document.getElementById('console').innerText = msg; }
        
        function startScan() {
            const apples = document.querySelectorAll('.apple');
            let count = 0;
            
            log("يتم الفحص الآن...");
            let scan = setInterval(() => {
                apples.forEach(a => a.classList.remove('active'));
                apples[count % 5].classList.add('active');
                count++;
            }, 100);

            setTimeout(() => {
                log("يتم التحديد الآن...");
                clearInterval(scan);
                setTimeout(() => {
                    let winner = Math.floor(Math.random() * 5);
                    apples.forEach(a => a.classList.remove('active'));
                    apples[winner].classList.add('active');
                    log("تم تحديد التفاحة الصالحة: " + (winner + 1));
                    if(navigator.vibrate) navigator.vibrate(500);
                }, 1000);
            }, 2000);
        }
    </script>
</body>
</html>
